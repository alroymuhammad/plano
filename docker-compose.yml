services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plano
      POSTGRES_PASSWORD: plano
      POSTGRES_DB: plano
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plano -d plano']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.2 # same minor as @qdrant/js-client-rest 1.20; bump them together
    restart: unless-stopped
    ports:
      - '6333:6333' # REST, dashboard at /dashboard
      - '6334:6334' # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
