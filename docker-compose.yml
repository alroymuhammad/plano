services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plano
      POSTGRES_PASSWORD: plano
      POSTGRES_DB: plano
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plano -d plano']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
